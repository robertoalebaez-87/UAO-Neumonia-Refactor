[project]
name = "detector-neumonia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "pydicom>=3.0.2",
    "tensorflow>=2.21.0",
]

[project.scripts]
detector-neumonia = "detector_neumonia:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]


[tool.pytest.ini_options]
pythonpath = ["."]
